<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Tom com Timbre e Duração</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; background: #f4f4f4; color: #333; }
        .card { background: white; padding: 25px; border-radius: 8px; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        .group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select, button { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #040798; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #030570; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Gerador de Tom Musical</h2>
        
        <div class="group">
            <label for="noteSelect">Escolher Nota Musical:</label>
            <select id="noteSelect" onchange="updateFreqFromSelect()">
                <option value="">-- Selecione uma nota --</option>
                <!-- Oitava 3 -->
                <option value="130.81">C3 (Dó 3) - 130.81 Hz</option>
                <option value="146.83">D3 (Ré 3) - 146.83 Hz</option>
                <option value="164.81">E3 (Mi 3) - 164.81 Hz</option>
                <option value="174.61">F3 (Fá 3) - 174.61 Hz</option>
                <option value="196.00">G3 (Sol 3) - 196.00 Hz</option>
                <option value="220.00">A3 (Lá 3) - 220.00 Hz</option>
                <option value="246.94">B3 (Si 3) - 246.94 Hz</option>
                <!-- Oitava 4 -->
                <option value="261.63">C4 (Dó 4) - 261.63 Hz</option>
                <option value="293.66">D4 (Ré 4) - 293.66 Hz</option>
                <option value="329.63">E4 (Mi 4) - 329.63 Hz</option>
                <option value="349.23">F4 (Fá 4) - 349.23 Hz</option>
                <option value="392.00">G4 (Sol 4) - 392.00 Hz</option>
                <option value="440.00" selected>A4 (Lá 4) - 440.00 Hz</option>
                <option value="493.88">B4 (Si 4) - 493.88 Hz</option>
                <!-- Oitava 5 -->
                <option value="523.25">C5 (Dó 5) - 523.25 Hz</option>
                <option value="587.33">D5 (Ré 5) - 587.33 Hz</option>
                <option value="659.25">E5 (Mi 5) - 659.25 Hz</option>
                <option value="698.46">F5 (Fá 5) - 698.46 Hz</option>
                <option value="783.99">G5 (Sol 5) - 783.99 Hz</option>
                <option value="880.00">A5 (Lá 5) - 880.00 Hz</option>
                <option value="987.77">B5 (Si 5) - 987.77 Hz</option>
            </select>
        </div>

        <div class="group">
            <label for="freq">Frequência (Hz):</label>
            <input type="number" id="freq" value="440" step="any">
        </div>

        <div class="group">
            <label for="waveType">Tipo de Onda (Timbre):</label>
            <select id="waveType">
                <option value="sine">Senoidal (Suave / Pura)</option>
                <option value="square">Quadrada (Metálica / 8-bit)</option>
                <option value="sawtooth">Dente de Serra (Brilhante / Rico)</option>
                <option value="triangle">Triangular (Suave com harmônicos)</option>
            </select>
        </div>

        <div class="group">
            <label for="duration">Duração (segundos):</label>
            <input type="number" id="duration" value="2" step="0.5" min="0.1">
        </div>

        <button onclick="playTone()">Tocar Tom</button>
    </div>

    <script>
        function updateFreqFromSelect() {
            const select = document.getElementById('noteSelect');
            const freqInput = document.getElementById('freq');
            if (select.value) {
                freqInput.value = select.value;
            }
        }

        function playTone() {
            const freq = parseFloat(document.getElementById('freq').value);
            const duration = parseFloat(document.getElementById('duration').value);
            const waveType = document.getElementById('waveType').value;

            if (!freq || freq <= 0) {
                alert('Insira uma frequência válida.');
                return;
            }

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = waveType; 
            oscillator.frequency.value = freq;

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            
            setTimeout(() => {
                oscillator.stop();
                audioCtx.close();
            }, duration * 1000);
        }
    </script>
</body>
</html>
